map $host $x_robots_tag {
    default "";
    test.prestigeflow.co.uk "noindex, nofollow";
    prestige-flow-old-web.fvbnid.easypanel.host "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Keep the public test hostname out of search results without changing live-domain headers.
    add_header X-Robots-Tag $x_robots_tag always;

    include /etc/nginx/legacy-redirects.conf;

    location = /robots.txt { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }
    location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
